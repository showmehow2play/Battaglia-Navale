<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Errori - Battaglia Navale</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #1e1e1e;
            color: #d4d4d4;
        }
        #errors {
            background: #252526;
            padding: 20px;
            border-radius: 5px;
            white-space: pre-wrap;
            max-height: 80vh;
            overflow-y: auto;
        }
        .error {
            color: #f48771;
            margin: 10px 0;
            padding: 10px;
            background: #3c1f1e;
            border-left: 3px solid #f48771;
        }
        .success {
            color: #89d185;
            margin: 10px 0;
            padding: 10px;
            background: #1e3c1e;
            border-left: 3px solid #89d185;
        }
        h1 {
            color: #4ec9b0;
        }
    </style>
</head>
<body>
    <h1>🔍 Test Caricamento JavaScript</h1>
    <div id="errors"></div>

    <script>
        const errorsDiv = document.getElementById('errors');
        
        // Cattura errori globali
        window.onerror = function(msg, url, lineNo, columnNo, error) {
            const errorMsg = `
❌ ERRORE JAVASCRIPT:
Messaggio: ${msg}
File: ${url}
Linea: ${lineNo}
Colonna: ${columnNo}
Stack: ${error ? error.stack : 'N/A'}
            `;
            const errorEl = document.createElement('div');
            errorEl.className = 'error';
            errorEl.textContent = errorMsg;
            errorsDiv.appendChild(errorEl);
            return false;
        };

        // Log di successo
        function logSuccess(msg) {
            const successEl = document.createElement('div');
            successEl.className = 'success';
            successEl.textContent = '✅ ' + msg;
            errorsDiv.appendChild(successEl);
        }

        // Test caricamento script
        logSuccess('Test iniziato...');
    </script>

    <!-- Carica gli script del gioco -->
    <script src="js/peerjs.min.js"></script>
    <script>
        if (typeof Peer !== 'undefined') {
            logSuccess('PeerJS caricato correttamente');
        } else {
            const errorEl = document.createElement('div');
            errorEl.className = 'error';
            errorEl.textContent = '❌ PeerJS non caricato';
            errorsDiv.appendChild(errorEl);
        }
    </script>

    <script src="js/utils.js"></script>
    <script>
        logSuccess('utils.js caricato');
    </script>

    <script src="js/ship.js"></script>
    <script>
        if (typeof Ship !== 'undefined') {
            logSuccess('Ship class caricata');
        } else {
            const errorEl = document.createElement('div');
            errorEl.className = 'error';
            errorEl.textContent = '❌ Ship class non caricata';
            errorsDiv.appendChild(errorEl);
        }
    </script>

    <script src="js/grid.js"></script>
    <script>
        if (typeof Grid !== 'undefined') {
            logSuccess('Grid class caricata');
        } else {
            const errorEl = document.createElement('div');
            errorEl.className = 'error';
            errorEl.textContent = '❌ Grid class non caricata';
            errorsDiv.appendChild(errorEl);
        }
    </script>

    <script src="js/game-engine.js"></script>
    <script>
        if (typeof BattleshipGame !== 'undefined') {
            logSuccess('BattleshipGame class caricata');
        } else {
            const errorEl = document.createElement('div');
            errorEl.className = 'error';
            errorEl.textContent = '❌ BattleshipGame class non caricata';
            errorsDiv.appendChild(errorEl);
        }
    </script>

    <script src="js/ai.js"></script>
    <script>
        if (typeof AIManager !== 'undefined') {
            logSuccess('AIManager class caricata');
        } else {
            const errorEl = document.createElement('div');
            errorEl.className = 'error';
            errorEl.textContent = '❌ AIManager class non caricata';
            errorsDiv.appendChild(errorEl);
        }
    </script>

    <script src="js/ui.js"></script>
    <script>
        if (typeof UIManager !== 'undefined') {
            logSuccess('UIManager class caricata');
        } else {
            const errorEl = document.createElement('div');
            errorEl.className = 'error';
            errorEl.textContent = '❌ UIManager class non caricata';
            errorsDiv.appendChild(errorEl);
        }
    </script>

    <script src="js/peer-multiplayer.js"></script>
    <script>
        if (typeof PeerMultiplayer !== 'undefined') {
            logSuccess('PeerMultiplayer class caricata');
        } else {
            const errorEl = document.createElement('div');
            errorEl.className = 'error';
            errorEl.textContent = '❌ PeerMultiplayer class non caricata';
            errorsDiv.appendChild(errorEl);
        }
    </script>

    <script src="js/placement-modes.js"></script>
    <script>
        logSuccess('placement-modes.js caricato');
    </script>

    <script src="js/slot-machine.js"></script>
    <script>
        if (typeof SlotMachineManager !== 'undefined') {
            logSuccess('SlotMachineManager class caricata');
        } else {
            const errorEl = document.createElement('div');
            errorEl.className = 'error';
            errorEl.textContent = '❌ SlotMachineManager class non caricata';
            errorsDiv.appendChild(errorEl);
        }
    </script>

    <script src="js/app.js"></script>
    <script>
        if (typeof BattleshipApp !== 'undefined') {
            logSuccess('BattleshipApp class caricata');
            
            // Prova a creare un'istanza
            try {
                const testApp = new BattleshipApp();
                logSuccess('BattleshipApp istanziata con successo');
            } catch (e) {
                const errorEl = document.createElement('div');
                errorEl.className = 'error';
                errorEl.textContent = '❌ Errore nell\'istanziare BattleshipApp:\n' + e.message + '\n' + e.stack;
                errorsDiv.appendChild(errorEl);
            }
        } else {
            const errorEl = document.createElement('div');
            errorEl.className = 'error';
            errorEl.textContent = '❌ BattleshipApp class non caricata';
            errorsDiv.appendChild(errorEl);
        }
    </script>

    <script>
        logSuccess('Test completato. Controlla gli errori sopra.');
    </script>
</body>
</html>
